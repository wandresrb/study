# Build + deploy a Cloudflare Workers (static assets) desde GitHub Actions.
#
# Por qué aquí y no en Workers Builds de Cloudflare: su builder no persiste
# ninguna caché entre builds (máquina limpia, ~26 min) y mata el proceso a los
# 20 minutos con SIGKILL. Aquí controlamos el timeout y persistimos dos cachés:
#   - la de paquetes de bun (ahorra el install)
#   - node_modules/.astro: el manifest del build incremental + la copia del
#     dist anterior, para que solo se regeneren las lecciones que cambiaron.
#
# Secrets requeridos en el repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token con permiso "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  el account id (dashboard → Workers & Pages → overview)
#
# Y desconectar el repo de Workers Builds en el dashboard de Cloudflare para
# que no haya dos deploys compitiendo por el mismo push.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Caché de paquetes de bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # key con el sha: nunca hay hit exacto, así el post-job siempre sube la
      # caché fresca; restore-keys recupera la del build anterior más reciente.
      # El manifest se autoinvalida si cambian astro.config o bun.lock, así que
      # restaurar una caché "vieja" nunca produce output rancio.
      - name: Caché del build incremental de Astro
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
            .astro
          key: astro-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-${{ runner.os }}-

      - run: bun run build

      - name: Deploy a Cloudflare
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
